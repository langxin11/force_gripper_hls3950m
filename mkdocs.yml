site_name: HLS3950 力控夹爪
site_description: HLS3950 双指力控夹爪中文工程文档
docs_dir: docs
site_dir: build/docs
theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
nav:
  - 首页: index.md
  - 总体架构: architecture.md
  - HLS3950 通信适配: hls3950-adaptation.md
  - URT-1 接线: urt1-wiring.md
  - 机械设计与装配: mechanical.md
  - 主机通信协议: host-protocol.md
  - 开发与测试: development.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
