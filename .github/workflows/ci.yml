name: CI

on:
  push:
  pull_request:

jobs:
  firmware-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware -B build/firmware
      - run: cmake --build build/firmware
      - run: ctest --test-dir build/firmware --output-on-failure

  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project software --extra dev --frozen
      - run: uv run --project software pytest software/tests
      - run: uv run --project software pre-commit run --all-files
      - run: uv run --project software mypy --config-file software/pyproject.toml software/src

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project software --extra docs --frozen
      - run: uv run --project software mkdocs build --strict
