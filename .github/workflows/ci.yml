name: CI

on:
  push:
  pull_request:

jobs:
  firmware-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware -B build/firmware
      - run: cmake --build build/firmware
      - run: ctest --test-dir build/firmware --output-on-failure

  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'software[dev]'
      - run: pytest software/tests
      - run: ruff check software
      - run: mypy software/src

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'software[docs]'
      - run: mkdocs build --strict
