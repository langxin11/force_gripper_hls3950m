[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hls3950-gripper"
version = "0.1.0"
description = "HLS3950 力控夹爪上位机 SDK 与命令行工具"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-pyserial>=3.5",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
hardware = [
  "vassar-feetech-servo-sdk==1.5.0",
]

[project.scripts]
hls3950-gripper = "hls3950_gripper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hls3950_gripper"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = [
    "serial.*",
    "scservo_sdk",
    "scservo_sdk.*",
    "vassar_feetech_servo_sdk",
    "vassar_feetech_servo_sdk.*",
]
ignore_missing_imports = true
